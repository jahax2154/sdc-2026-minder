function toast(message){$('#announcer').textContent=message;document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=message;document.body.append(e);clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),3200);}
function update(message){persist();render();if(message)toast(message);}
function shell(){return `<a class="skip" href="#main">Skip to content</a><button class="scrim" aria-label="Close menu" data-action="menu-close"></button><aside class="sidebar" aria-label="Main navigation"><a class="brand" href="#home" aria-label="Minder Home"><span class="brand-mark"><span></span></span>minder.</a><button class="new-chat" data-action="chat">${icon('plus')}New conversation</button><nav><p class="nav-label">YOUR SPACE</p><a class="nav-item active" href="#home" aria-current="page">${icon('home')}Home</a><button class="nav-item" data-action="explore" aria-expanded="${state.exploreOpen}" aria-controls="explore-children">${icon('compass')}Explore${icon('chevron')}</button><div id="explore-children" class="subnav" ${state.exploreOpen?'':'hidden'}><button data-action="careers">Careers</button><button data-action="path">My Path</button></div><button class="nav-item" data-action="chat">${icon('chat')}Minder Chat</button><button class="nav-item" data-action="bot-open">${icon('bot')}Mindbot${state.bot.enabled?'<span class="tag-on">ON</span>':''}</button><button class="nav-item" data-action="profile">${icon('user')}My profile</button><div class="keep-moving"><p class="nav-label">KEEP MOVING</p><button class="nav-item" data-action="roadmap">${icon('target')}My roadmap</button><button class="nav-item" data-action="tasks">${icon('circle')}My tasks</button></div></nav><div class="account"><div class="avatar">${esc(initials())}</div><div><strong>${esc(name())}</strong><p class="muted">Personal workspace</p></div><button class="account-more" aria-label="Preview options" data-action="options">···</button></div></aside><div class="shell"><header class="topbar"><button class="mobile-menu" data-action="menu" aria-label="Open menu">${icon('menu')}</button><nav class="breadcrumbs" aria-label="Breadcrumb"><span>Workspace</span>${icon('chevron')}<strong>Home</strong></nav><div class="top-actions"><button class="search" data-action="search">${icon('search')}Search anything...</button><button class="ask" data-action="chat" aria-label="Ask Minder">${icon('spark')}<span>Ask Minder</span></button><div class="avatar" aria-label="${esc(name())}">${esc(initials())}</div></div></header><main id="main" tabindex="-1"><header class="page-heading"><h1>Good morning, ${esc(firstName())}.</h1><p>A clear next step, at your own pace.</p></header><section id="profile-section" aria-label="Your profile"></section><section id="direction-section" aria-label="Your direction"></section><div class="lower-grid"><section class="panel next-panel" aria-labelledby="next-title"><header class="section-head"><h2 id="next-title">Next steps</h2><div class="tabs" role="tablist" aria-label="Next steps views">${['tasks','skills','progress'].map(t=>`<button role="tab" id="tab-${t}" aria-controls="next-content" aria-selected="${state.tab===t}" tabindex="${state.tab===t?0:-1}" data-action="tab" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></header><div id="next-content" class="tab-content" role="tabpanel" aria-labelledby="tab-${state.tab}"></div></section><section id="bot-section" class="panel bot-panel" aria-labelledby="bot-title"></section></div><footer class="preview-footer"><span>Illustrative preview · ${storage?'Saved on this browser':'Session only'}</span><button data-action="options">Preview states & settings</button></footer></main></div>`;}
function render(){ $('#app').innerHTML=shell();$('#profile-section').innerHTML=profileView();$('#direction-section').innerHTML=directionView();$('#next-content').innerHTML=nextView();$('#bot-section').innerHTML=botView(); syncSidebar(); }
function syncSidebar(){const side=$('.sidebar');if(side)side.inert=matchMedia('(max-width:900px)').matches&&!side.classList.contains('visible');}
matchMedia('(max-width:900px)').addEventListener('change',syncSidebar);
function profileView(){return `<div class="panel profile-panel">${state.profile?`<div class="avatar">${esc(initials())}</div>`:round('user')}<div class="profile-copy"><h2>Your profile</h2>${state.profile?`<div class="profile-line"><strong>${esc(name())}</strong> <span>· ${esc(state.profile.background)}</span></div><p>Interested in ${esc(state.profile.interests)}.</p>`:'<p>Help Minder understand your background and goals.</p>'}</div><div class="profile-actions">${state.profile?`<span class="pill"><span class="dot"></span>Ready</span>${btn('Edit profile','profile',false,'edit')}`:btn('Set up profile','profile',true)}</div></div>`;}
function directionView(){let heading='Find a career direction that fits',copy='Start with your profile to discover relevant career matches.',label='YOUR DIRECTION',action=btn('Find career matches','find-matches',true,'arrow','disabled aria-describedby="profile-first"'),hint='<p class="hint" id="profile-first">Your profile comes first</p>';
if(state.profile){copy='Your profile is ready. Explore roles and see why they may suit you.';action=btn('Find career matches','find-matches',true);hint='';}
if(state.matches){heading='Your career matches are ready';copy='Review possible directions and choose what you want to explore.';action=btn('Review matches','careers',true);}
if(state.career){label='YOUR CHOSEN DIRECTION';heading=esc(state.career);copy=state.path?'Build practical skills through small, explainable projects.':'Turn this direction into a practical plan at your own pace.';action=btn(state.path?'Continue my path':'Build my path',state.path?'path':'build-path',true)+link('Explore other careers','careers');}
return `<div class="panel direction-panel">${state.career?'':round('compass')}<div class="direction-copy"><p class="eyebrow">${label}</p><h2>${heading}</h2><p>${copy}</p>${hint}</div><div class="direction-actions">${action}</div></div>`;}
function nextView(){if(!state.path){const info={tasks:['list','Your next steps will start here','Choose a career direction to build your first plan.'],skills:['book','Discover what to practise','Your chosen direction will help you focus on relevant skills.'],progress:['target','Your progress starts with a first step','Completed work will appear here once you begin your plan.']}[state.tab];return `<div class="empty">${round(info[0])}<h3>${info[1]}</h3><p>${info[2]}</p>${state.career?btn('Build my path','build-path',true):link('How it works','how')}</div>`;}
if(state.tab==='tasks')return `<div class="task-feature">${icon('file')}<div class="task-copy"><p class="eyebrow">RECOMMENDED NEXT</p><h3>${state.taskDone?'Visualise patterns in your dataset':'Clean a small dataset'}</h3><p>${state.taskDone?'Find a pattern and explain what it means.':'Handle missing values and explain the choices you make.'}</p><p class="meta">${state.taskDone?'30':'45'} min · Data cleaning${state.schedule==='Friday'&&!state.taskDone?' · Friday':''}</p></div>${btn('Open task',state.taskDone?'task-next':'task',true)}</div><h3 class="after-title">After this</h3><div class="task-row">${icon('circle')}<span>${state.taskDone?'Write a short findings summary':'Visualise patterns in your dataset'}</span><span class="duration">${state.taskDone?'25':'30'} min</span></div><div class="section-footer">${link('View all tasks','tasks')}${state.taskDone?'<span class="small muted">One more step completed</span>':''}</div>`;
if(state.tab==='skills')return `<div class="skill-focus"><h3>Build confidence in data cleaning</h3><p>Practise handling missing values in a small dataset.</p><span class="pill">${icon('edit')}Practising · Self-reported</span>${btn('Open practice task','task',true,'')}</div><div class="section-footer">${link('View all skills','skills')}</div>`;
return `<p class="progress-text">${state.taskDone?4:3} of 8 tasks completed</p><p class="small muted">Task completion, not skill mastery.</p><div class="progress-track" role="progressbar" aria-label="Tasks completed" aria-valuemin="0" aria-valuemax="8" aria-valuenow="${state.taskDone?4:3}"><span style="width:${state.taskDone?50:37.5}%"></span></div><div class="activity">${icon('check')}<div>${state.taskDone?'Clean a small dataset':'Read and summarise a dataset'}<small>Completed · Data cleaning</small></div></div><p class="small muted">Milestone 2 · ${state.taskDone?2:1} of 4 tasks completed</p><div class="section-footer">${link('Review progress','progress')}${link('Continue my path','path')}</div>`;}
function botView(){let head=`<header class="section-head"><h2 id="bot-title">Mindbot</h2>${state.bot.enabled&&state.bot.message==='pending'?'<span class="pill"><span class="dot"></span>1 new</span>':state.bot.enabled?`<span class="pill">${icon('check')}You’re all caught up</span>`:''}</header>`;
if(!state.bot.configured)return head+`<div class="empty">${round('bot')}<h3>Make Mindbot yours</h3><p>Set up your personal agent and choose the updates you want to see.</p>${btn('Set up Mindbot','bot-setup',true)}</div>`;
if(!state.bot.enabled)return head+`<div class="empty">${round('bot')}<h3>Your Mindbot is paused</h3><p>Your preferences are saved. Turn ${esc(state.bot.name)} on when you’re ready.</p>${btn('Manage Mindbot','bot-setup',true)}</div>`;
const identity=`<div class="bot-identity">${round('bot')}<div><strong>${esc(state.bot.name)}</strong><span> · Your Mindbot</span></div></div>`;
if(state.bot.message==='pending')return head+`<article class="bot-message">${identity}<h3>I have a suggestion for your week.</h3><p>Move your data-cleaning task to Friday to fit your availability.</p><span class="pill review">${icon('info')}Needs your review</span>${btn('Review suggestion','review',true)}</article>${link('Open Mindbot','bot-open')}`;
return head+identity+`<h3 class="quiet-heading">How can I help you today?</h3><p class="quiet-copy">Ask for help with your next step or plan your week.</p><div class="quick-prompts">${btn('Help me get started','bot-help',false,'bulb')}${btn('Plan my week','bot-week',false,'calendar')}</div><button class="message-entry" data-action="bot-chat">${icon('send')}Message ${esc(state.bot.name)}...<span class="send">${icon('arrow')}</span></button>`;}
function modal(title,body){lastFocus=document.activeElement?.dataset?.action||null;$('#dialogs').innerHTML=`<dialog class="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title">${title}</h2><button type="button" class="icon-button" data-action="close" aria-label="Close dialog">${icon('close')}</button></div>${body}</dialog>`;const d=$('.dialog');d.addEventListener('close',()=>{document.querySelector(`[data-action="${lastFocus}"]`)?.focus();});d.showModal();}
function close(){const d=$('.dialog');if(d){d.close();$('#dialogs').innerHTML='';}}
function profileForm(){modal(state.profile?'Edit your profile':'Set up your profile',`<p>A little context helps Minder suggest relevant directions.</p><form id="profile-form"><label class="field-label" for="full-name">Your name</label><input id="full-name" name="name" autocomplete="name" maxlength="60" required value="${esc(name())}"><label class="field-label" for="background">Current background</label><input id="background" name="background" maxlength="100" required placeholder="e.g. Computer Science student" value="${esc(state.profile?.background||'')}"><label class="field-label" for="interests">Interests</label><input id="interests" name="interests" maxlength="160" required placeholder="e.g. AI and practical problem-solving" value="${esc(state.profile?.interests||'')}"><p class="disclaimer">Preview profile fields. Production uses the existing My profile records; this example saves only in your browser.</p><div class="actions">${btn('Cancel','close',false,'')}<button class="btn primary" type="submit">Save profile ${icon('check')}</button></div></form>`);}
function careerModal(){if(!state.profile){profileForm();return;}if(!state.matches){state.matches=true;update('Illustrative career matches are ready.');}modal('Explore your career matches',`<p>Review a direction before choosing it. Choosing a career does not create a plan automatically.</p><p class="disclaimer">Illustrative matches for this frontend reference, not calculated recommendations. Full Matches / Compare / Outlook pages belong to Careers.</p><div class="choice-list">${['Machine Learning Engineer','Data Scientist'].map(n=>`<button class="choice" data-action="choose-career" data-career="${n}"><strong>${n}</strong><span>${n==='Data Scientist'?'Explore data, test ideas, and explain findings.':'Build and evaluate models that solve practical problems.'}</span></button>`).join('')}</div>`);}
function botSetup(){modal('Set up your Mindbot',`<p>Personalise your agent independently of your career path.</p><form id="bot-form"><label class="field-label" for="bot-name">Agent name</label><input id="bot-name" name="botName" maxlength="30" required value="${esc(state.bot.name)}"><label class="check"><input type="checkbox" name="enabled" ${!state.bot.configured||state.bot.enabled?'checked':''}>Enable my Mindbot</label><label class="check"><input type="checkbox" name="suggestions" ${state.bot.suggestions?'checked':''}>Show planning suggestions on Home</label><p class="disclaimer">This configures the preview only. It does not launch a background agent or grant calendar access. Suggestions need your review.</p><div class="actions">${btn('Cancel','close',false,'')}<button type="submit" class="btn primary">Save preferences ${icon('check')}</button></div></form>`);}
function taskModal(next=false){if(!state.path){modal('Your tasks',`<p>Choose a direction and build your path first.</p><div class="actions">${btn('Explore careers','careers',true)}</div>`);return;}modal(next?'Visualise patterns in your dataset':'Clean a small dataset',`<p>${esc(state.career)} · Milestone 2</p><span class="pill">${icon('clock')}${next?'30':'45'} min · Data cleaning</span><p>${next?'Create one clear chart and explain the pattern you see.':'Load a small CSV, identify missing values, and explain how you handled them.'}</p><p><strong>You are done when:</strong> ${next?'your chart has a title and a short interpretation.':'you have saved the cleaned dataset and written a short explanation.'}</p>${!next?`<form id="note-form"><label class="field-label" for="task-note">Work note or evidence</label><textarea id="task-note" name="note" maxlength="2000" placeholder="What did you do?">${esc(state.taskNote)}</textarea><button type="submit" class="text-button">Save note ${icon('check')}</button></form><p class="small">Schedule: ${esc(state.schedule)}</p><div class="actions">${btn(state.taskDone?'Mark incomplete':'Mark complete','complete',true,'check')}</div>`:`<p class="disclaimer">This reference demonstrates completion on the data-cleaning task. Continue this task in the production My Path workflow.</p>`}`);}
function botChat(prompt=''){if(!state.bot.configured){botSetup();return;}modal(`Message ${esc(state.bot.name)}`,`<p class="disclaimer">Frontend preview: no AI service is connected. You can save a draft; it will not be sent.</p><form id="draft-form"><label class="field-label" for="draft">Your message</label><textarea id="draft" name="draft" maxlength="2000" required>${esc(prompt||state.draft||'')}</textarea><div class="actions">${btn('Cancel','close',false,'')}<button class="btn primary" type="submit">Save draft ${icon('check')}</button></div></form>`);}
function options(){modal('Preview states & settings',`<p>Choose a sample to review the independent Home states. Loading a sample replaces this preview’s browser-local demo data.</p><div class="preview-choices">${[['first','First visit'],['profile','Profile ready only'],['matches','Matches ready to review'],['chosen','Career chosen · No plan yet'],['active','Active path · New Mindbot message'],['quiet','Active path · Skills · Quiet Mindbot'],['progress','Active path · Progress'],['bot-only','Mindbot ready · Profile not set up']].map(([id,label])=>btn(label,'preset',false,'',`data-preset="${id}"`)).join('')}</div><hr>${link('Manage Mindbot preferences','bot-setup')}`);}
function handle(action,el){switch(action){
case'close':close();break;
case'menu':$('.sidebar').classList.add('visible');$('.scrim').classList.add('visible');syncSidebar();$('.sidebar a').focus();break;
case'menu-close':$('.sidebar').classList.remove('visible');$('.scrim').classList.remove('visible');syncSidebar();$('.mobile-menu').focus();break;
case'explore':state.exploreOpen=!state.exploreOpen;persist();el.setAttribute('aria-expanded',state.exploreOpen);$('#explore-children').hidden=!state.exploreOpen;break;
case'tab':state.tab=el.dataset.tab;persist();$('#next-content').innerHTML=nextView();$('#next-content').setAttribute('aria-labelledby','tab-'+state.tab);document.querySelectorAll('[role=tab]').forEach(b=>{b.setAttribute('aria-selected',b.dataset.tab===state.tab);b.tabIndex=b.dataset.tab===state.tab?0:-1;});break;
case'profile':profileForm();break;
case'find-matches':case'careers':careerModal();break;
case'choose-career':{let n=el.dataset.career;if(state.path&&n!==state.career){modal('Keep your existing path',`<p>Your active path is ${esc(state.career)}. This Home-only reference does not replace an existing plan. Use Careers in the integrated application to compare and change directions while preserving your work.</p><div class="actions">${btn('Back to matches','careers',true)}</div>`);}else{state.career=n;close();update('Direction chosen. Build a path when you’re ready.');}break;}
case'build-path':if(!state.career){careerModal();break;}modal('Build your first path',`<p>A practical starter plan for ${esc(state.career)}.</p><ul><li>Build your foundation</li><li>Build and explain a small data project</li><li>Train and evaluate a baseline model</li></ul><p class="disclaimer">The preview loads an illustrative plan with three previously completed sample tasks. This is example data, not work credited to you. Production plans begin with actual user records.</p><div class="actions">${btn('Cancel','close',false,'')}${btn('Load sample path','confirm-path',true)}</div>`);break;
case'confirm-path':state.path=true;close();update('Sample path loaded. Your Mindbot settings are unchanged.');break;
case'path':case'roadmap':if(!state.path){handle(state.career?'build-path':'careers');break;}modal('Your path',`<p>${esc(state.career)}</p><ul class="task-list"><li><span>Build your foundation</span><strong>2 / 2</strong></li><li><span>Build and explain a small data project</span><strong>${state.taskDone?2:1} / 4</strong></li><li><span>Train and evaluate a baseline model</span><strong>0 / 2</strong></li></ul><p class="disclaimer">Integration destination: Explore → My Path → Roadmap. This dialog is the standalone preview equivalent.</p><div class="actions">${btn('Open next task',state.taskDone?'task-next':'task',true)}</div>`);break;
case'tasks':if(!state.path){taskModal();break;}modal('Your tasks',`<ul class="task-list"><li><span>Review Python fundamentals</span><span>Complete</span></li><li><span>Write your first data script</span><span>Complete</span></li><li><span>Read and summarise a dataset</span><span>Complete</span></li><li><span>Clean a small dataset</span><button class="text-button" data-action="task">${state.taskDone?'Completed':'Open task'}</button></li><li><span>Visualise patterns in your dataset</span><button class="text-button" data-action="task-next">Open task</button></li><li><span>Write a short findings summary</span><span>Next</span></li><li><span>Train a baseline model</span><span>Upcoming</span></li><li><span>Evaluate your model</span><span>Upcoming</span></li></ul><p class="disclaimer">Integration destination: My Path → Next steps.</p>`);break;
case'task':taskModal();break;case'task-next':taskModal(true);break;
case'complete':state.taskDone=!state.taskDone;close();update(state.taskDone?'Task completed. Your progress is updated.':'Task marked incomplete.');break;
case'skills':modal('Skills for your path',`<p><strong>Data cleaning</strong> · Practising · Self-reported</p><p>Task completion adds practice evidence. It does not automatically upgrade skill proficiency.</p>${state.taskNote?`<div class="evidence">${esc(state.taskNote)}</div>`:'<p>No work note added yet.</p>'}<p class="disclaimer">Integration destination: My Path → Skills. Skill records should also be shared with My profile.</p><div class="actions">${btn('Open practice task','task',true)}</div>`);break;
case'progress':modal('Your progress',`<p><strong>${state.taskDone?4:3} of 8 tasks completed</strong></p><p>1 of 3 milestones completed. Milestone 2: ${state.taskDone?2:1} of 4 tasks.</p><p>Most recent work: ${state.taskDone?'Clean a small dataset':'Read and summarise a dataset'}.</p><p class="disclaimer">Integration destination: My Path → Progress. Completion is not a measure of employability or verified skill mastery.</p><div class="actions">${btn('Review completed task','task',true)}</div>`);break;
case'bot-setup':botSetup();break;
case'bot-open':if(!state.bot.configured||!state.bot.enabled)botSetup();else if(state.bot.message==='pending')handle('review');else botChat();break;
case'bot-chat':botChat();break;case'bot-help':botChat('Help me get started with my next step.');break;case'bot-week':botChat('Help me plan my week.');break;
case'review':modal('Review Mindbot suggestion',`<p><strong>Move “Clean a small dataset” to Friday?</strong></p><p>Nothing has been changed yet. This is an illustrative planning suggestion.</p><p class="disclaimer">Accepting updates the task schedule in this preview only. It does not write to a calendar.</p><div class="actions">${btn('Dismiss','dismiss',false,'')}${btn('Accept suggestion','accept',true,'check')}</div>`);break;
case'accept':state.schedule='Friday';state.bot.message='none';close();update('Task scheduled for Friday in this preview.');break;
case'dismiss':state.bot.message='none';close();update('Suggestion dismissed. Your task is unchanged.');break;
case'chat':modal('Ask Minder',`<p>Get career guidance, clarify a task, or think through a decision.</p><p class="disclaimer">This Home package does not connect an LLM. In the integrated application this opens Minder Chat with the current profile, direction and task context.</p><div class="actions">${btn('Close','close',true,'')}</div>`);break;
case'how':modal('One clear step at a time',`<ol><li>Set up your profile.</li><li>Review careers that may fit you.</li><li>Choose a direction and build a path.</li><li>Work on a task and review your progress.</li></ol><p>Your Mindbot is optional and can be configured independently.</p><div class="actions">${btn(state.profile?'Explore careers':'Set up profile',state.profile?'careers':'profile',true)}</div>`);break;
case'search':modal('Find your way',`<p>Quick links within this Home preview.</p><div class="preview-choices">${btn('Your profile','profile',false,'user')}${btn('Careers','careers',false,'compass')}${btn('Your tasks','tasks',false,'list')}${btn('Mindbot','bot-open',false,'bot')}</div>`);break;
case'options':options();break;
case'preset':state=preset(el.dataset.preset);history.replaceState(null,'',location.pathname+location.hash);close();update('Preview state loaded.');break;
}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)handle(el.dataset.action,el);});
document.addEventListener('keydown',e=>{if(e.target.matches('[role=tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=[...document.querySelectorAll('[role=tab]')],i=tabs.indexOf(e.target);const next=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3;tabs[next].click();tabs[next].focus();}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=new FormData(f);
if(f.id==='profile-form'){const values=['name','background','interests'].map(k=>String(d.get(k)).trim());if(values.some(x=>!x)){toast('Please complete each field.');return;}state.profile={name:values[0],background:values[1],interests:values[2]};close();update('Profile saved. Your plan and Mindbot settings are unchanged.');}
if(f.id==='bot-form'){const n=String(d.get('botName')).trim();if(!n){toast('Please enter a name.');return;}state.bot={...state.bot,configured:true,enabled:d.has('enabled'),name:n,suggestions:d.has('suggestions')};if(!state.bot.suggestions)state.bot.message='none';close();update('Mindbot preferences saved.');}
if(f.id==='note-form'){state.taskNote=String(d.get('note')).trim();persist();toast('Work note saved.');}
if(f.id==='draft-form'){state.draft=String(d.get('draft')).trim();persist();close();toast('Draft saved locally. No message was sent.');}
});render();
})();

</script></body></html>

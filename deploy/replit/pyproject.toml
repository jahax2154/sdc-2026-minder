# A owns installation at repository root and uv.lock generation.
[project]
name = "minder-replit-runtime"
version = "0.1.0"
description = "Locked provider environment for the existing Minder runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PyJWT==2.15.1",
  "annotated-types==0.8.0",
  "anyio==4.15.1",
  "attrs==26.1.0",
  "certifi==2026.10.23",
  "cffi==2.1.1",
  "clerk-backend-api==7.0.0",
  "cloudpickle==3.1.2",
  "cryptography==50.0.2",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "idna==3.20",
  "joblib==1.6.0",
  "jsonschema-specifications==2025.9.1",
  "jsonschema==4.26.0",
  "narwhals==2.27.1",
  "numpy==2.5.4",
  "pycparser==3.12",
  "pydantic==2.14.1",
  "pydantic_core==2.50.1",
  "pypdf==6.21.2",
  "referencing==0.37.0",
  "rpds-py==2026.9.1",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "threadpoolctl==3.7.0",
  "typing-inspection==0.4.4",
  "typing_extensions==4.16.0",
  "charset-normalizer==3.5.2",
  "google-api-core==2.43.0",
  "google-auth==2.62.0",
  "google-cloud-core==2.8.0",
  "google-cloud-storage==2.19.0",
  "google-crc32c==1.9.0",
  "google-resumable-media==2.11.0",
  "googleapis-common-protos==1.76.0",
  "opentelemetry-api==1.45.1",
  "proto-plus==1.29.0",
  "protobuf==7.36.2",
  "psycopg==3.3.6",
  "psycopg-binary==3.3.6",
  "pyasn1==0.6.4",
  "pyasn1-modules==0.4.2",
  "replit.object-storage==1.0.2",
  "requests==2.34.2",
  "urllib3==2.8.0",
]

# Keep valid platform markers outside UPM's project-dependency parser.
[dependency-groups]
runtime = [
  "xgboost==3.4.1; platform_system != \"Linux\"",
  "xgboost-cpu==3.4.1; platform_system == \"Linux\"",
]

[tool.uv]
default-groups = ["runtime"]
